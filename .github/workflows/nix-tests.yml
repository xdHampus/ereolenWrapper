name: "Testing"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # The mock server reads these as well as the test binary: it checks the
      # api key and library code on every request and answers as the configured
      # user. Both processes have to agree, which is why they are set job-wide.
      TEST_API_KEY : ${{ secrets.TEST_API_KEY }}
      TEST_LIBRARY : ${{ secrets.TEST_LIBRARY }}
      TEST_PASSWORD : ${{ secrets.TEST_PASSWORD }}
      TEST_USERNAME : ${{ secrets.TEST_USERNAME }}
      FLASK_APP : "src/test/mock-server/app.py"
      GTEST_OUTPUT : "xml"
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Start the mock API server
      run: nix develop -c flask run --host=0.0.0.0 &
    - name: Wait for the mock API server
      # `nix develop` evaluates the flake and builds the dev shell before flask
      # even starts, which takes long enough that the tests would otherwise
      # connect to a port nothing is listening on yet.
      run: timeout 300 bash -c 'until curl -sf http://localhost:5000/ > /dev/null; do sleep 2; done'
    - run: nix run .#checks.x86_64-linux.tests -L
    - run: nix run .#checks.x86_64-linux.testsLua -L
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the previous step fails
      with:
        report_paths: 'test*.xml'
